name: docs

# The site and its per-PR previews both live on the gh-pages branch: the main
# site at the root, previews under previews/pr-<n>/. Pages serves that branch.
#
# Previews are maintainer-only, and the gate is the repository's own rulesets
# rather than a list here: `no branches` restricts branch creation to admin
# bypass, so a pull request from *this* repository can only have come from a
# maintainer. Fork pull requests are verified but never deployed — building
# them runs bin/gen-docs, which executes repository code, and doing that with a
# token that can write to gh-pages would hand a stranger the site.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'COORDINATION.md'
      - 'Dockerfile'
      - 'mkdocs.yml'
      - 'bin/gen-docs'
      - 'src/tools/gen-docs.ts'
      - 'src/views/registry.ts'
      - '.github/workflows/docs.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'COORDINATION.md'
      - 'mkdocs.yml'
      - 'bin/gen-docs'
      - 'src/tools/gen-docs.ts'
      - 'src/views/registry.ts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: verify docs
    # a closed pull request has nothing to verify, only a preview to remove
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # --check: the generated table must already match the registry, every
      # view must have a page, and mkdocs --strict rejects a broken link
      - name: generate and build the docs
        run: bin/gen-docs --check
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
      # a fork pull request gets no preview URL, so say where the site it just
      # built actually is rather than leaving the reviewer to guess
      - name: how to see it
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo '### Docs preview'
            echo
            echo 'This pull request comes from a fork, so it is verified but not deployed.'
            echo 'Download the **site** artifact from this run and open `index.html`, or'
            echo 'push the branch to this repository for a preview URL.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # every job that pushes gh-pages takes turns
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # the repository, for the script — gh-pages holds a built site and
      # nothing else, so the script cannot live there
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: incoming
      - name: commit the site to gh-pages
        env:
          TARGET: .
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-site.sh

  preview:
    name: preview
    # Maintainers only, and the gate is the `no branches` ruleset: a branch in
    # this repository can only be created by an admin, so a pull request whose
    # head lives here is a maintainer's.
    #
    # Two branch patterns are excluded from that ruleset so machines can write
    # them, which also means write access — not admin — is enough to push them.
    # A pull request from either would otherwise be a non-admin's branch
    # reaching the one job that holds contents:write:
    #
    #   gh-pages       CI publishes the site here
    #   dependabot/**  Dependabot cannot be given a ruleset bypass on a
    #                  personal repository, so its branches are excluded
    #
    # Dependabot's own runs get a read-only token anyway, so a preview would
    # fail rather than deploy — skipping is the honest outcome, not a red X.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'gh-pages' &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: incoming
      - name: commit the preview to gh-pages
        env:
          TARGET: previews/pr-${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-site.sh
      - name: link it on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://jubrad.github.io/colinear/previews/pr-${{ github.event.pull_request.number }}/
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/comment-preview.sh

  cleanup:
    name: remove preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: drop the preview
        env:
          TARGET: previews/pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -d "$TARGET" ] || { echo "no preview at $TARGET"; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git rm -rq "$TARGET"
          git commit -qm "docs: drop preview for #${{ github.event.pull_request.number }}"
          git push -q origin gh-pages
