name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # the same gate the project runs by hand: typecheck, docs lint, build,
      # and the CDC replay that proves the client mirror matches the store.
      # It picks its own throwaway state dir, so no runner state is touched.
      - run: bin/check
