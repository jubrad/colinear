name: pages

# Deploy whatever is on gh-pages, using the Pages *deployment* API rather than
# the legacy branch builder.
#
# Why the indirection: gh-pages holds the main site at the root and previews
# under previews/pr-<n>/, which needs a branch. Serving that branch through the
# legacy builder failed with nothing but "Page build failed" on every commit —
# including a commit that only deleted files — while the deployment API had
# published every time it was asked. So the branch stays the store, and this
# publishes it.
#
# No loop: this workflow reads gh-pages and pushes nothing.
#
# It deploys whatever the branch holds regardless of how the triggering run
# concluded — the branch is the source of truth, and a deploy of the current
# state is never the wrong thing to do.

on:
  # NOT `push: branches: [gh-pages]` — a push trigger reads the workflow from
  # the branch that was pushed, and gh-pages holds a built site with no
  # .github/ at all, so that trigger never fires. workflow_run reads from the
  # default branch, which is where this file lives.
  workflow_run:
    workflows: [docs, preview cleanup]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
