name: pages

# Deploy whatever is on gh-pages, using the Pages *deployment* API rather than
# the legacy branch builder.
#
# Why the indirection: gh-pages holds the main site at the root and previews
# under previews/pr-<n>/, which needs a branch. Serving that branch through the
# legacy builder failed with nothing but "Page build failed" on every commit —
# including a commit that only deleted files — while the deployment API had
# published every time it was asked. So the branch stays the store, and this
# publishes it.
#
# No loop: this workflow reads gh-pages and pushes nothing.

# Not `push: branches: [gh-pages]`, which cannot fire, for two independent
# reasons — either would be enough on its own:
#
#   - the push is made by `docs` with the default GITHUB_TOKEN, and GitHub
#     deliberately starts no workflow run from a GITHUB_TOKEN event, to stop
#     workflows triggering each other in a loop;
#   - a `push` workflow is resolved from the *pushed branch's* own tree, and
#     gh-pages holds a built site and no `.github/` at all.
#
# It was written that way and never ran once: every deployment this site has
# ever had was a human pressing the button. `workflow_run` is the documented
# answer to exactly this — it is not suppressed by GITHUB_TOKEN, and it
# resolves from the default branch, where this file lives.
on:
  workflow_run:
    workflows: [docs]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the site
    # a docs run that failed pushed nothing worth publishing. Dispatch is always
    # honoured: it is the way to republish without touching the branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
