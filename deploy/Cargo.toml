# The cluster side of multi-user colinear: the CRD types, the operator, and
# (later) the gateway. design/multi-user/operator.md is the design.
[workspace]
resolver = "3"
members = ["crds", "operator"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# one place for every version: Dependabot reads this file, and two pins drift
[workspace.dependencies]
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "ring"] }
# kube 4.2 is built against 0.28; a second version fails to build
k8s-openapi = { version = "0.28", features = ["v1_33", "schemars"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal"] }
anyhow = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# the reconcile loop around kube-runtime: finalizers, backoff, events, metrics
k8s-controller = "0.14"
async-trait = "0.1"
coli-crds = { path = "crds" }
